name: Validate migrations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run demo:project
      - run: npm run demo:tables
      - run: npm run demo:helpers
      - run: npm run demo:laravel
      - run: npm run demo:changes
      - run: npm run demo:current-update
      - run: npm run demo:index-rename
      - run: npm run demo:drop-columns
      - run: npm run demo:drop-constrained-id
      - run: npm run demo:morphs
      - run: npm run demo:acceptance
